name: Update third-party cask metadata

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Generate cask metadata
        run: nix run --no-update-lock-file .#update-casks

      - name: Validate generated metadata
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Commit updates or keep scheduled workflow active
        shell: bash
        run: |
          set -euo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add cask.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cask metadata"
            git push
            exit 0
          fi

          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date +%s)"
          if (( now_epoch - last_commit_epoch >= 30 * 24 * 60 * 60 )); then
            git commit --allow-empty -m "chore: keep updater active"
            git push
          else
            echo "No metadata update or heartbeat is due."
          fi
